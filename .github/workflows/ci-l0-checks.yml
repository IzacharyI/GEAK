name: CI L0 — checks

# L0: cheap, fast, GPU-free checks that gate every push / PR.
# Runs entirely on GitHub-hosted ubuntu runners — no dataset, no GPU, no Claude,
# no secrets. The expensive GPU e2e lives in the self-hosted L1 workflow.

on:
  # The v4 line now lives on `main` (the default branch), so CI gates main.
  push:
    branches: ["main", "ci/**"]
  pull_request:
    # NOTE: ci/** is TEMPORARY (self-test via a PR whose base is a ci/** branch).
    # Revert to just ["main"] before real use.
    branches: ["main", "ci/**"]

# Supersede in-flight runs for the same ref (a new push cancels the old run).
concurrency:
  group: l0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Advisory only for now (the tree has pre-existing findings); surfaces
      # issues in the log without blocking merges. Flip to blocking once clean.
      - name: ruff check (non-blocking)
        continue-on-error: true
        run: ruff check .

  pytest:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      # Stdlib-only tests (import run_e2e via importlib; no claude_agent_sdk / GPU).
      # Files are listed explicitly rather than discovered, so that adding a test
      # under examples/ (torch/triton + GPU) can never silently break this job.
      #
      # torch is deliberately NOT installed here: it is optional in these tests and
      # only the CUDA-dependent assertions need it, which belong on L1's GPU runner.
      # Installing it would add minutes to a job that currently finishes in seconds.
      - name: unit tests (no GPU)
        run: |
          python -m pytest -q \
            interface/test_run_e2e_recovery.py \
            interface/test_run_e2e_alignment.py \
            e2e_workflow/scripts/tests/test_workload_alignment.py \
            e2e_workflow/scripts/tests/test_run_correctness_gate.py \
            e2e_workflow/scripts/tests/test_parse_regime_sources.py \
            e2e_workflow/scripts/tests/test_gsm8k_eval.py \
            kernel_workflow/tests/test_gpu_lease.py \
            kernel_workflow/tests/test_multi_rank_analysis.py \
            kernel_workflow/tests/test_moe_bottleneck_analysis.py \
            kernel_workflow/tests/test_ab_retry.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: analysis skill toggle regression
        run: node kernel_workflow/tests/test_moe_advisory_skill_off_identical.js
      - name: distributed specialty wiring
        run: node kernel_workflow/tests/test_distributed_fusion_knowledge.js
      # This is the KERNEL workflow: a win has to be visible in the changed kernel's own
      # time, not in the wall time around it. The gate that enforces that REJECTS
      # candidates, so it is the one place where a silent regression in the workflow
      # turns straight back into a promoted regression in the kernel.
      - name: attribution gate
        run: node kernel_workflow/tests/test_attribution_gate.js
      # A resumed wave whose analyze fast path finds no prior roadmap must re-analyse rather than
      # run on an empty ladder. Wave 15 ran three rounds that way and lost a rung for three waves.
      - name: analyze resume fallback
        run: node kernel_workflow/tests/test_analyze_resume_fallback.js

      # A rung is closed by a verified number, not by having been planned. Without this, a rung
      # whose arm faulted counts as taken, nothing records it as owed, and the ladder's last rung
      # is never reached — which is what happened to the fusion rung for three waves.
      - name: open rungs carry forward
        run: node kernel_workflow/tests/test_open_rungs.js

      # The producer half of a fusion cannot be faster on its own. Judging it on speed rejects it,
      # it never enters the canonical tree, and the consumer half is written against a tree where it
      # does not exist -- which is how this project reached a half-fused kernel and stopped.
      - name: enabling steps judged on function
        run: node kernel_workflow/tests/test_enabling_step.js

      # max_no_improve stops a search that has stopped finding things. A round that never got the
      # lease found nothing because it never looked, and charging it ended one wave a round early
      # with hardware still in the budget.
      - name: a round that measured nothing is not a round that found nothing
        run: node kernel_workflow/tests/test_evidence_stop.js

      # The two Analyze artifacts. Both gates decide what a lease gets spent on, and both have a
      # blind spot that already cost waves: the graph cannot see operands nobody produces, and the
      # pipe table can size a hole that no direction then claims.
      - name: analyze artifact gates
        run: |
          node kernel_workflow/tests/test_task_graph_gate.js
          node kernel_workflow/tests/test_pipe_occupancy_gate.js

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the WORKING TREE, not git history: actions/checkout fetches a single
      # commit by default, so a history scan here would be meaningless. This is the
      # gate that stops a NEW secret from landing. Known false positives are
      # allowlisted in .gitleaks.toml.
      # The upstream binary is used directly rather than gitleaks-action, which
      # requires a paid license key for organization-owned repos.
      - name: gitleaks (working tree)
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --config .gitleaks.toml

  node-regression:
    name: Node regression (expert_skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Proves the use_expert_skills=OFF path injects nothing (byte-identical).
      # Pure node (fs/path only) — no npm install needed.
      - name: expert_skills OFF-identical regression
        run: |
          node e2e_workflow/scripts/test_expert_skills_off_identical.js
          node kernel_workflow/tests/test_gpu_request.js

  dry-run:
    name: run_e2e dry-run mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Validates the handoff -> e2e_workflow.js args mapping against a committed
      # fixture (ci/fixtures/handoff.dry.json), so it needs no geak_runtime
      # dataset, GPU, or Claude. Guards the map_args / build_prompt code path.
      - name: handoff -> args mapping (fixture)
        run: python interface/run_e2e.py ci/fixtures/handoff.dry.json /tmp/l0_result.json --dry-run
