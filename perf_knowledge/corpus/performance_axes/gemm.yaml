schema_version: 1
family: gemm

# A backend-neutral vocabulary for comparing implementation bundles.  This file maps spelling to
# questions; it does not claim that two values are equivalent or that either value is fast.
contract:
  source_observation: "A mapped source construct proves only that the backend exposes this decision."
  shipped_config: "A normalized shipped value is a seed, not a benchmark result."
  measured_bundle: "Only an exact-context benchmark may rank complete decision bundles."
  attribution: "A bundle speedup must never be distributed over its individual axes."

backend_representations:
  flydsl: direct_dsl_and_host_config
  triton: compiler_selected_dsl_and_meta_parameters
  gluon: explicit_layout_dsl_and_meta_parameters
  hip: source_kernel_or_launcher
  ck: positional_template_instantiation
  cktile: generated_template_instantiation
  asm: launcher_contract_for_precompiled_binary

# These fields decide whether two measured bundles may be compared at all. They are context, not
# kernel knobs, and therefore stay outside the axes below.
comparison_context:
  required:
    - operator_family
    - math_contract
    - dtype
    - gfx
    - shape
    - baseline
    - accounting
    - aiter_commit
    - toolchain
  routing:
    - regime
    - reused_weight
    - first_call_or_steady_state
    - workload_weights
  contract: "A mismatch in any stated required field creates a different comparison context; missing identity yields no measured prior."

axes:
  - id: compute_instruction
    kind: performance_choice
    question: "Which matrix-compute family and instruction shape does the implementation request?"
    comparison_contract: "Instruction names are exact only for direct MFMA source. tl.dot, CK XDL templates and an ASM object name are family-level evidence until compiler/ISA evidence resolves them."
    source_mappings:
      - categories: [mfma_intrinsic, mfma_shape]
        representation: instruction_or_compiler_op
      - categories: [ck_instance]
        representation: template_family
      - categories: [asm_object]
        representation: binary_identity
      - categories: [instance_name]
        representation: encoded_kernel_name
    knob_aliases:
      non_k_dim: [matrix_instr_nonkdim, MATRIX_INSTR_NONKDIM]
      instruction_m: [mfma_m, instr_m]
      instruction_n: [mfma_n, instr_n]
      instruction_k: [mfma_k, instr_k]
      instruction: [mfma, mfma_intrinsic, instruction, instr_shape]

  - id: workgroup_tile
    kind: performance_choice
    question: "How much M/N/K work does one workgroup own?"
    comparison_contract: "M/N/K are directly comparable only when all three name workgroup-level extents; source hits that expose one symbol remain partial."
    required_components: [m, n, k]
    source_mappings:
      - categories: [tile_shape]
        representation: source_parameter
      - categories: [asm_tile]
        representation: launcher_or_object_contract
      - categories: [config_space]
        representation: legal_search_space
    knob_aliases:
      m: [BLOCK_SIZE_M, BLOCK_M, TILE_M, tile_m, tileM, TileM, SUBM, MPerBlock]
      n: [BLOCK_SIZE_N, BLOCK_N, TILE_N, tile_n, tileN, TileN, SUBN, NPerBlock]
      k: [BLOCK_SIZE_K, BLOCK_K, TILE_K, tile_k, tileK, TileK, SUBK, KPerBlock]

  - id: work_partition
    kind: performance_choice
    question: "How is work partitioned or persisted across tiles and the K dimension?"
    comparison_contract: "split_k is numeric when exposed; persistent and grouping fields describe different scheduling choices and must not be collapsed into one scalar."
    source_mappings:
      - categories: [split_k]
        representation: source_parameter
      - categories: [persistent]
        representation: structural_variant
    knob_aliases:
      split_k: [split_k, splitK, SPLIT_K, NUM_KSPLIT, ACTUAL_KSPLIT, selectedksplit, selectedsplitK]
      group_m: [GROUP_SIZE_M, group_size_m]
      persistent_tiles: [persistent_n_tiles, PERSISTENT_N_TILES]
      grid_mn: [GRID_MN]

  - id: execution_geometry
    kind: performance_choice
    question: "How many waves/warps and workitems cooperate on the tile?"
    comparison_contract: "num_warps and workgroup_size are launch geometry; waves_per_eu is an occupancy hint and is retained as a separate component."
    source_mappings:
      - categories: [waves]
        representation: source_parameter
      - categories: [asm_launch]
        representation: launcher_contract
    knob_aliases:
      num_warps: [num_warps, NUM_WARPS]
      waves_per_eu: [waves_per_eu, WAVES_PER_EU]
      workgroup_size: [workgroup_size, block_size, blockSize, blockSizeX]
      block_m_warps: [block_m_warps, BLOCK_M_WARPS]
      block_n_warps: [block_n_warps, BLOCK_N_WARPS]

  - id: pipeline_schedule
    kind: performance_choice
    question: "How are loads, LDS buffering and matrix instructions pipelined and ordered?"
    comparison_contract: "Stage counts are numeric seeds. CK scheduler/version and explicit FlyDSL scheduling are structural choices, not interchangeable numeric values."
    source_mappings:
      - categories: [lds_stage, async_copy, scheduling, pipeline_variant]
        representation: source_pipeline_construct
      - categories: [ck_pipeline]
        representation: template_scheduler_or_version
    knob_aliases:
      stages: [num_stages, NUM_STAGES, stages, STAGES, lds_stage]
      scheduler: [scheduler, pipeline_scheduler, BlockGemmPipelineScheduler]
      version: [pipeline_version, BlockGemmPipelineVersion]
      async_copy: [async_copy, use_async_copy, ASYNC_COPY]

  - id: operand_layout
    kind: performance_choice
    question: "How are operands transformed before and inside LDS?"
    comparison_contract: "Preshuffle, LDS swizzle and padding are independent components. Matching labels do not prove identical byte layouts."
    source_mappings:
      - categories: [layout_preshuffle]
        representation: host_and_kernel_layout_contract
      - categories: [lds_swizzle, lds_pad]
        representation: lds_address_transform
    knob_aliases:
      layout: [layout, operand_layout]
      preshuffle_b: [b_preshuffle, preshuffle_b, BPreshuffle]
      lds_swizzle: [lds_swizzle, swizzle]
      lds_pad: [lds_pad, pad_k]

  - id: memory_access
    kind: performance_choice
    question: "Which access width and cache policy does the data path use?"
    comparison_contract: "Widths compare only in the same address space and dtype; cache hints retain their backend spelling."
    source_mappings:
      - categories: [access_width]
        representation: source_access_width
      - categories: [cache_policy]
        representation: source_cache_hint
    knob_aliases:
      access_bytes: [DMA_BYTES, access_bytes, vector_bytes]
      cache_policy: [cache_modifier, cache_policy]
      kpack: [kpack, KPACK]

  - id: epilogue
    kind: performance_choice
    question: "How is the accumulator rearranged and written?"
    comparison_contract: "CShuffle/cshuffle names establish an epilogue family only; exact layouts require backend-specific evidence."
    source_mappings:
      - categories: [layout_epilogue]
        representation: epilogue_family
    knob_aliases:
      family: [epilogue, epilogue_family, CShuffle, cshuffle, use_cshuffle_epilog]

  - id: architecture_capability
    kind: hard_constraint
    question: "Which implementation paths and instruction/data formats exist on the target architecture?"
    comparison_contract: "An architecture gate may reject a path. Absence of a source hit is not an unsupported verdict."
    source_mappings:
      - categories: [arch_gate]
        representation: explicit_source_gate
    knob_aliases:
      gfx: [gfx, arch, architecture]
      required_gfx: [required_gfx, target_gfx]
      excluded_gfx: [excluded_gfx, exclude_gfx]

  - id: configuration_constraints
    kind: hard_constraint
    question: "Which combinations are legal with respect to divisibility, LDS/register budgets and fixed parameters?"
    comparison_contract: "Constraints filter impossible candidates; satisfying them makes a candidate legal, not fast."
    source_mappings:
      - categories: [config_limit, config_validity]
        representation: source_legality_rule
    knob_aliases:
      max_lds_bytes: [max_lds_bytes, lds_limit, LDS_LIMIT]
      max_split_k: [MAX_KSPLIT, max_split_k]
      even_k: [EVEN_K, even_k]
      kpack: [kpack, KPACK]
      fixed_stages: [fixed_stages]
      fixed_pack_n: [fixed_pack_n]

  - id: tunable_surface
    kind: search_space
    question: "Which knobs exist, which values are legal seeds, and which fields are derived rather than tunable?"
    comparison_contract: "A declared knob or shipped value defines a candidate/search surface; occurrence and selection do not prove optimality."
    source_mappings:
      - categories: [tunable_param]
        representation: declared_knob
      - categories: [config_space]
        representation: legal_or_shipped_space
    knob_aliases:
      tile_m: [BLOCK_SIZE_M, BLOCK_M, TILE_M, tile_m, tileM, TileM, SUBM, MPerBlock]
      tile_n: [BLOCK_SIZE_N, BLOCK_N, TILE_N, tile_n, tileN, TileN, SUBN, NPerBlock]
      tile_k: [BLOCK_SIZE_K, BLOCK_K, TILE_K, tile_k, tileK, TileK, SUBK, KPerBlock]
      split_k: [split_k, splitK, NUM_KSPLIT, MAX_KSPLIT]
      stages: [num_stages, stages, STAGES]
      num_warps: [num_warps, NUM_WARPS]
      waves_per_eu: [waves_per_eu, WAVES_PER_EU]

  - id: implementation_variant
    kind: structural_choice
    question: "Which kernel family or opaque backend implementation is selected for this scenario?"
    comparison_contract: "Variant identity is comparable as a bundle label only; a CK template or ASM object name does not expose its internal decisions."
    source_mappings:
      - categories: [kernel_family]
        representation: source_kernel_family
      - categories: [ck_instance]
        representation: template_family
      - categories: [asm_object]
        representation: binary_identity
      - categories: [instance_name, pipeline_variant]
        representation: encoded_variant_name
    knob_aliases:
      variant: [implementation_name, kernel_family, variant]
      object: [object_name, co_name, hsaco]

  - id: runtime_contract
    kind: integration_contract
    question: "Which host-side layout, argument block, workspace and launch contract must the kernel satisfy?"
    comparison_contract: "Runtime contracts are correctness/integration requirements. Launch geometry can affect performance but cannot be copied without matching the kernel's decode."
    source_mappings:
      - categories: [asm_argblock]
        representation: packed_argument_abi
      - categories: [asm_launch]
        representation: launcher_grid_and_workgroup
      - categories: [layout_preshuffle]
        representation: host_and_kernel_layout_contract
    knob_aliases:
      argument_block: [argument_block, argblock, KernelArgs]
      grid_formula: [grid_formula, launch_grid]
      workgroup_size: [workgroup_size, block_size, blockSize, blockSizeX]
      workspace_bytes: [workspace_bytes, workspace_size]
      layout: [layout, operand_layout]

dependencies:
  - id: lds_layout_is_bidirectional
    axes: [operand_layout, workgroup_tile, configuration_constraints]
    relation: end_to_end_contract
    rule: "An LDS swizzle/padding transform must be identical at producer and consumer addresses for both operands; changing one site is a correctness change, not a performance candidate."
    decision_refs: [flydsl-xor16-lds-layout-consistency]

  - id: architecture_selects_compute_bundle
    axes: [architecture_capability, compute_instruction, memory_access, pipeline_schedule, implementation_variant]
    relation: selects_or_rejects
    rule: "Architecture may jointly select MFMA shape, DMA width, async-copy availability and kernel-family availability; do not tune one as an independent runtime flag."
    decision_refs: [flydsl-gfx942-path-gates, flydsl-half-mfma-call-forms]

  - id: tile_geometry_sets_resource_legality
    axes: [workgroup_tile, execution_geometry, pipeline_schedule, configuration_constraints]
    relation: coupled_legality
    rule: "Tile, cooperating waves and stage count jointly determine vector-load divisibility and LDS/register use; validate the bundle before compiling or timing it."
    decision_refs: [flydsl-hgemm-config-space, flydsl-hgemm-tiling-validity]

  - id: split_k_depends_on_tile_k
    axes: [work_partition, workgroup_tile, configuration_constraints, runtime_contract]
    relation: coupled_legality
    rule: "K must divide across split_k and leave a tile_k-divisible inner loop; the reduction workspace/counter and launch grid must match."
    decision_refs: [flydsl-hgemm-config-space, flydsl-hgemm-tiling-validity]

  - id: preshuffle_is_end_to_end_layout
    axes: [operand_layout, implementation_variant, runtime_contract, configuration_constraints]
    relation: end_to_end_contract
    rule: "Preshuffle changes host storage and kernel addressing together; B-in-LDS/family compatibility and amortization regime must be checked as one bundle."
    decision_refs: [flydsl-preshuffle-b-layout-contract]

  - id: explicit_schedule_expires_with_geometry
    axes: [pipeline_schedule, workgroup_tile, execution_geometry, memory_access, compute_instruction]
    relation: retune_on_change
    rule: "Changing tile, stages, access width or MFMA count invalidates literal instruction-group counts; retain the ordering hypothesis and rederive/remeasure the schedule."
    decision_refs: [flydsl-splitk-hot-loop-schedule-bundle]

  - id: small_m_routes_to_a_family
    axes: [implementation_variant, architecture_capability, workgroup_tile, work_partition, execution_geometry]
    relation: scenario_routing
    rule: "Small M can route to a distinct family with fixed M tile and different N/K, persistence and occupancy axes; architecture availability is checked first."
    decision_refs: [flydsl-small-m-hgemm-family]
