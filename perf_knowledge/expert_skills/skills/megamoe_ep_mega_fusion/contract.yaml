      - 'BN\s*=\s*stage2\.block_n'
      - '_g2_active_block_m\s*=\s*stage2\.block_m'
      - '_g2_sbm\s*=\s*(?:int\()?full_config\.stage1\.sort_block_m'

  - id: stage2_max_m_blocks_are_block_units
